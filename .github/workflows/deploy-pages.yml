# Deploy dashboard Monev UMKM ke GitHub Pages (project site chulit/jak-365).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          # ID Sheet publik (sama seperti di .env lokal) — tanpa ini,
          # build Pages tidak punya ID dan dashboard jatuh ke data contoh.
          VITE_SHEET_ID: 1v8velGd7wZflo82bX0oB7fcisckQve67n6jppNBdSmg
        run: npm run build
      - name: List build output
        run: ls -la dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
